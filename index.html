<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Question Bank Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>E-Commerce (Hons) Study Hub</h1>
        <div class="search-container">
            <input type="text" id="searchBar" placeholder="Search questions, keywords (e.g., EDI, Firewall)..." onkeyup="filterQuestions()">
        </div>
        <div class="filter-container">
            <button class="filter-btn active" onclick="filterByMarks('all')">All Marks</button>
            <button class="filter-btn" onclick="filterByMarks('2')">2 Marks</button>
            <button class="filter-btn" onclick="filterByMarks('5')">5 Marks</button>
            <button class="filter-btn" onclick="filterByMarks('10')">10 Marks</button>
        </div>
        <nav class="unit-nav">
            <button class="unit-btn active" onclick="switchUnit(1)">Unit 1</button>
            <button class="unit-btn" onclick="switchUnit(2)">Unit 2</button>
            <button class="unit-btn" onclick="switchUnit(3)">Unit 3</button>
            <button class="unit-btn" onclick="switchUnit(4)">Unit 4</button>
            <button class="unit-btn" onclick="switchUnit(5)">Unit 5</button>
        </nav>
    </header>

    <main id="questionSpace">
        </main>

    <script src="app.js"></script>
</body>
</html>
